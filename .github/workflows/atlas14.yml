name: Build Atlas 14 rainfall tiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build_atlas14.py", ".github/workflows/atlas14.yml"]

permissions:
  contents: write

concurrency:
  group: atlas14
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy<2"
      - run: python scripts/build_atlas14.py
      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas14
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update NOAA Atlas 14 rainfall tiles"
          git pull --rebase origin main
          git push
